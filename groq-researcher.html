<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Groq Web Researcher</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb" crossorigin="anonymous"></script>
    <style>
        :root { --primary: #f97316; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); max-width: 800px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }
        .header-actions { display: flex; gap: 0.75rem; align-items: center; font-size: 0.85rem; }
        .header-actions a { color: var(--text); text-decoration: none; }
        .setup-warning { background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: none; }
        .setup-warning a { color: #991b1b; font-weight: bold; }

        /* Session sidebar */
        .session-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
        .session-bar select { flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 16px; background: white; min-width: 0; }
        .session-bar button { padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: white; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
        .session-bar button:hover { background: #f1f5f9; }

        .chat-container { flex: 1; background: white; border: 1px solid var(--border); border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; overflow-y: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .input-area { display: flex; flex-direction: column; gap: 0.75rem; }

        /* iOS zoom fix: font-size must be >= 16px */
        textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; resize: vertical; min-height: 80px; font-family: inherit; font-size: 16px; box-sizing: border-box; }

        .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .toggle { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #64748b; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; font-size: 16px; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
        .message { margin-bottom: 1.5rem; line-height: 1.6; }
        .message.user { color: #475569; font-weight: 600; border-left: 3px solid var(--primary); padding-left: 0.75rem; }
        .message.assistant { color: var(--text); }
        .message.assistant table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
        .message.assistant th, .message.assistant td { border: 1px solid var(--border); padding: 0.5rem; text-align: left; }
        .message.assistant th { background: #f8fafc; }
        .message.error { color: #ef4444; }
        .footer { margin-top: auto; padding-top: 1.5rem; text-align: center; font-size: 0.8rem; color: #94a3b8; }
        .footer a { color: var(--primary); text-decoration: none; }

        @media (max-width: 600px) {
            body { padding: 0.5rem; }
            h1 { font-size: 1.25rem; }
            .chat-container { padding: 0.75rem; }
            textarea { min-height: 60px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Groq Web Researcher</h1>
        <div class="header-actions">
            <a href="settings.html">⚙ Settings</a>
            <a href="index.html">&larr; All Tools</a>
        </div>
    </div>

    <div id="setupWarning" class="setup-warning">
        Missing Groq API Key! Please configure it in the <a href="settings.html">Settings</a> page.
    </div>

    <div class="session-bar">
        <select id="sessionSelect" onchange="loadSession(this.value)">
            <option value="">— New Chat —</option>
        </select>
        <button onclick="saveCurrentSession()">💾 Save</button>
        <button onclick="deleteCurrentSession()">🗑 Delete</button>
    </div>

    <div class="chat-container" id="chat">
        <div class="message assistant">Hello! I am an agentic researcher. Ask me a question and I can search the web to find the answer.</div>
    </div>

    <div class="input-area">
        <textarea id="prompt" placeholder="E.g., What is the latest news regarding AI models?"></textarea>
        <div class="controls">
            <label class="toggle">
                <input type="checkbox" id="useMini">
                Fast (compound-mini)
            </label>
            <button class="btn-primary" id="submitBtn" onclick="runAgent()">Research</button>
        </div>
    </div>

    <div class="footer">
        <a href="index.html">← All Tools</a> &bull; 
        <a href="https://github.com/franciscohui/html-tools">Source Code</a> &bull; 
        Built with the <a href="https://simonwillison.net/2025/Dec/10/html-tools/">HTML Tools pattern</a>
    </div>

    <script>
        const SESSIONS_KEY = 'groq_researcher_sessions';
        const CURRENT_SESSION_KEY = 'groq_researcher_current';
        let chatHistory = []; // Array of {role, content} for the current session
        let currentSessionId = null;

        const apiKey = localStorage.getItem('groq_api_key');
        if (!apiKey) {
            document.getElementById('setupWarning').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('prompt').disabled = true;
        }

        // --- Session Management ---
        function getSessions() {
            return JSON.parse(localStorage.getItem(SESSIONS_KEY) || '{}');
        }

        function saveSessions(sessions) {
            localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
        }

        function refreshSessionList() {
            const select = document.getElementById('sessionSelect');
            const sessions = getSessions();
            select.innerHTML = '<option value="">— New Chat —</option>';
            const sortedIds = Object.keys(sessions).sort((a, b) => b - a); // newest first
            for (const id of sortedIds) {
                const s = sessions[id];
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = s.title || 'Untitled';
                if (id === currentSessionId) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function saveCurrentSession() {
            if (chatHistory.length === 0) return;
            const sessions = getSessions();
            if (!currentSessionId) currentSessionId = String(Date.now());
            // Auto-title from first user message
            const firstUser = chatHistory.find(m => m.role === 'user');
            const title = firstUser ? firstUser.content.slice(0, 60) : 'Untitled';
            sessions[currentSessionId] = {
                title,
                history: chatHistory,
                savedAt: new Date().toISOString()
            };
            saveSessions(sessions);
            refreshSessionList();
        }

        function loadSession(sessionId) {
            if (!sessionId) {
                // New chat
                currentSessionId = null;
                chatHistory = [];
                document.getElementById('chat').innerHTML = '<div class="message assistant">Hello! I am an agentic researcher. Ask me a question and I can search the web to find the answer.</div>';
                return;
            }
            const sessions = getSessions();
            const session = sessions[sessionId];
            if (!session) return;
            currentSessionId = sessionId;
            chatHistory = session.history;
            // Rebuild chat UI
            const chatDiv = document.getElementById('chat');
            chatDiv.innerHTML = '';
            for (const msg of chatHistory) {
                if (msg.role === 'user') {
                    chatDiv.innerHTML += `<div class="message user">${escapeHtml(msg.content)}</div>`;
                } else {
                    chatDiv.innerHTML += `<div class="message assistant">${marked.parse(msg.content)}</div>`;
                }
            }
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        function deleteCurrentSession() {
            if (!currentSessionId) return;
            if (!confirm('Delete this saved chat?')) return;
            const sessions = getSessions();
            delete sessions[currentSessionId];
            saveSessions(sessions);
            currentSessionId = null;
            chatHistory = [];
            document.getElementById('chat').innerHTML = '<div class="message assistant">Hello! I am an agentic researcher. Ask me a question and I can search the web to find the answer.</div>';
            refreshSessionList();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize session list on load
        refreshSessionList();

        // --- Agent ---
        async function runAgent() {
            const promptInput = document.getElementById('prompt');
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            const useMini = document.getElementById('useMini').checked;
            const modelName = useMini ? "groq/compound-mini" : "groq/compound";
            
            const chatDiv = document.getElementById('chat');
            const submitBtn = document.getElementById('submitBtn');
            
            // Add user message
            chatDiv.innerHTML += `<div class="message user">${escapeHtml(prompt)}</div>`;
            chatHistory.push({ role: 'user', content: prompt });
            promptInput.value = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Researching...';
            
            // Create container for assistant response
            const responseId = 'resp-' + Date.now();
            chatDiv.innerHTML += `<div class="message assistant" id="${responseId}">...</div>`;
            const responseContainer = document.getElementById(responseId);
            chatDiv.scrollTop = chatDiv.scrollHeight;

            let fullText = '';

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: chatHistory.map(m => ({ role: m.role, content: m.content })),
                        stream: true,
                        compound_custom: {
                            tools: {
                                enabled_tools: ["web_search", "visit_website"]
                            }
                        }
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'API request failed');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                responseContainer.innerHTML = '';
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    
                    for (let line of lines) {
                        line = line.trim();
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.choices && data.choices.length > 0 && data.choices[0].delta?.content) {
                                    fullText += data.choices[0].delta.content;
                                    responseContainer.innerHTML = marked.parse(fullText);
                                    chatDiv.scrollTop = chatDiv.scrollHeight;
                                }
                            } catch (e) {
                                // Silently skip unparseable chunks
                            }
                        }
                    }
                }

                // Save assistant response to history
                if (fullText) {
                    chatHistory.push({ role: 'assistant', content: fullText });
                }

            } catch (error) {
                responseContainer.innerHTML = `<span class="error">Error: ${error.message}</span>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Research';
            }
        }

        // Allow Cmd/Ctrl+Enter to submit
        document.getElementById('prompt').addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                runAgent();
            }
        });
    </script>
</body>
</html>
