<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Web Researcher</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb" crossorigin="anonymous"></script>
    <style>
        :root { --primary: #f97316; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); max-width: 800px; margin: 0 auto; padding: 2rem; display: flex; flex-direction: column; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.75rem; color: var(--primary); }
        .setup-warning { background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 0.5rem; margin-bottom: 2rem; display: none; }
        .setup-warning a { color: #991b1b; font-weight: bold; }
        .chat-container { flex: 1; background: white; border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem; overflow-y: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .input-area { display: flex; flex-direction: column; gap: 1rem; }
        textarea { width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 0.5rem; resize: vertical; min-height: 100px; font-family: inherit; box-sizing: border-box; }
        .controls { display: flex; justify-content: space-between; align-items: center; }
        .toggle { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: #64748b; }
        button { background: var(--primary); color: white; border: none; padding: 0.75rem 2rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        .message { margin-bottom: 1.5rem; line-height: 1.6; }
        .message.user { color: #475569; font-weight: 600; }
        .message.assistant { color: var(--text); }
        .message.error { color: #ef4444; }
        .footer { margin-top: auto; padding-top: 2rem; text-align: center; font-size: 0.8rem; color: #94a3b8; }
        .footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Groq Web Researcher</h1>
        <a href="index.html" style="color: var(--text); text-decoration: none;">&larr; Back to Tools</a>
    </div>

    <div id="setupWarning" class="setup-warning">
        Missing Groq API Key! Please configure it in the <a href="settings.html">Settings</a> page.
    </div>

    <div class="chat-container" id="chat">
        <div class="message assistant">Hello! I am an agentic researcher. Ask me a question and I can search the web to find the answer.</div>
    </div>

    <div class="input-area">
        <textarea id="prompt" placeholder="E.g., What is the latest news regarding AI models?"></textarea>
        <div class="controls">
            <label class="toggle">
                <input type="checkbox" id="useMini">
                Use Fast Model (compound-mini)
            </label>
            <button id="submitBtn" onclick="runAgent()">Research</button>
        </div>
    </div>

    <div class="footer">
        <a href="index.html">← All Tools</a> &bull; 
        <a href="https://github.com/franciscohui/html-tools">Source Code</a> &bull; 
        Built with the <a href="https://simonwillison.net/2025/Dec/10/html-tools/">HTML Tools pattern</a>
    </div>

    <script>
        const apiKey = localStorage.getItem('groq_api_key');
        if (!apiKey) {
            document.getElementById('setupWarning').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('prompt').disabled = true;
        }

        async function runAgent() {
            const promptInput = document.getElementById('prompt');
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            const useMini = document.getElementById('useMini').checked;
            const modelName = useMini ? "groq/compound-mini" : "groq/compound";
            
            const chatDiv = document.getElementById('chat');
            const submitBtn = document.getElementById('submitBtn');
            
            // Add user message
            chatDiv.innerHTML += `<div class="message user">${prompt}</div>`;
            promptInput.value = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Researching...';
            
            // Create container for assistant response
            const responseId = 'resp-' + Date.now();
            chatDiv.innerHTML += `<div class="message assistant" id="${responseId}">...</div>`;
            const responseContainer = document.getElementById(responseId);
            chatDiv.scrollTop = chatDiv.scrollHeight;

            let fullText = '';

            try {
                // We use standard fetch() instead of the Node SDK to keep it zero-build
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: [{ role: "user", content: prompt }],
                        stream: true,
                        compound_custom: {
                            tools: {
                                enabled_tools: ["web_search", "visit_website"]
                            }
                        }
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'API request failed');
                }

                // Handle streaming response natively
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                responseContainer.innerHTML = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.choices[0].delta?.content) {
                                    fullText += data.choices[0].delta.content;
                                    responseContainer.innerHTML = marked.parse(fullText);
                                    chatDiv.scrollTop = chatDiv.scrollHeight;
                                }
                            } catch (e) {
                                console.error('Error parsing chunk:', e);
                            }
                        }
                    }
                }
            } catch (error) {
                responseContainer.innerHTML = `<span class="error">Error: ${error.message}</span>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Research';
            }
        }
    </script>
</body>
</html>
